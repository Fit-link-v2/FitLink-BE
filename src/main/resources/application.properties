spring.application.name=fitlink-be

# 앞단 Caddy(reverse proxy)가 넘기는 X-Forwarded-* 헤더로 원래 요청의 https · 호스트를 알아낸다
server.forward-headers-strategy=framework

# 상태 확인용 health만 연다
management.endpoints.web.exposure.include=health

# 로그인 세션 쿠키 이름. https 환경(dev · prod)은 __Host-Http-SESSION으로 바꿔 다른 서브도메인이 덮어쓰지 못하게 한다
fitlink.auth.cookie.session=SESSION
# 카카오 로그인 중 state를 담는 쿠키. https 환경은 __Host-Http-KAKAO-STATE
fitlink.auth.cookie.state=KAKAO-STATE

# 카카오 앱 키는 코드 · 설정 파일에 두지 않고 환경변수로만 받는다. local은 레포 루트의 .env(git 제외)에서 읽는다
spring.config.import=optional:file:.env[.properties]
fitlink.auth.kakao.client-id=${KAKAO_CLIENT_ID}
fitlink.auth.kakao.client-secret=${KAKAO_CLIENT_SECRET}
fitlink.auth.kakao.redirect-uri=http://localhost:8080/auth/kakao/callback

# local 개발용 PostgreSQL. 운영 구성(Caddy · Spring · PostgreSQL)은 배포 때 따로 둔다(BE-ADR-0015)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fitlink
      POSTGRES_USER: fitlink
      POSTGRES_PASSWORD: fitlink
    # 로컬에 설치된 PostgreSQL이 5432를 쓰고 있을 수 있어 5433으로 연다
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

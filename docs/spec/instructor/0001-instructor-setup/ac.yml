# AC 계약. 테스트가 무엇을 증명해야 하는지의 원본.
# id는 한 번 정하면 바꾸지 않는다. 삭제할 AC는 지우지 말고 status: removed
# Phase 1(US 1 가입 · 로그인 · 세션)은 AC-1 ~ AC-10, Phase 2(US 2 시간표 · 오픈 범위 · 자정 작업)는 AC-11 ~ AC-22다.
# 다음 Phase는 번호를 이어 붙인다(prd.md 1절 진행 단위). 시간표 AC(AC-11 ~ AC-21)의 "지금" · "오늘"은 테스트에서 고정한 Clock 값이다.
# 세션 만료(AC-7 · AC-22)는 DB의 now()를 쓰므로 expires_at도 DB 시각 기준으로 만든다.
spec: docs/spec/instructor/0001-instructor-setup/prd.md
version: 1
criteria:
  - id: AC-1
    source: [PRD-0001 AC 1.1.8, DEC-0008, BE-ADR-0014]
    description: "로그인 시작은 state 쿠키를 심고 카카오 인가 주소로 보낸다"
    type: security
    layers: [api, test]
    assertion: "GET /auth/kakao → 302, Location이 kauth.kakao.com/oauth/authorize이고 client_id · redirect_uri · response_type=code · state 쿼리를 가진다. 응답의 KAKAO-STATE 쿠키 값이 Location의 state와 같고 HttpOnly · Secure · SameSite=Lax · Path=/ · Max-Age=600이다. 두 번 호출하면 state가 다르다"
    priority: must
    verify: machine
    status: active
    failure_modes:
      - symptom: "콜백에서 정상 로그인도 state 불일치로 실패"
        cause: "쿠키 Path · SameSite 설정으로 카카오에서 돌아오는 요청에 쿠키가 안 실림"

  - id: AC-2
    source: [PRD-0001 AC 1.2.1, PRD-0001 AC 1.2.2, PRD-0001 AC 1.2.4]
    description: "처음 로그인한 카카오 계정은 강사와 설정 1행이 만들어진다"
    type: behavior
    layers: [schema, api, test]
    assertion: "처음 보는 카카오 회원 번호로 콜백이 성공하면 instructor 1행(provider=KAKAO)과 setting 1행(open_range_days=14)이 생긴다. 카카오 응답에 닉네임 · 이메일이 없으면 name · email은 null이고 가입은 성공한다"
    priority: must
    verify: machine
    status: active

  - id: AC-3
    source: [PRD-0001 AC 1.2.3]
    description: "같은 카카오 계정은 다시 가입되지 않는다"
    type: behavior
    layers: [schema, test]
    assertion: "이미 가입한 카카오 회원 번호로 다시 로그인하면 같은 instructor.id로 로그인되고 instructor · setting 행 수가 그대로다. 같은 번호의 가입 처리를 두 스레드에서 동시에 실행해도 instructor · setting은 1행씩이다"
    priority: must
    verify: machine
    status: active
    failure_modes:
      - symptom: "동시 로그인에서 500 또는 setting 0행"
        cause: "ON CONFLICT 없이 INSERT하거나, 0행 경로에서 기존 강사 조회를 빠뜨림"

  - id: AC-4
    source: [PRD-0001 AC 1.1.8, DEC-0008, BE-ADR-0008]
    description: "로그인 성공은 새 세션을 발급하고 설정의 성공 주소로 보낸다"
    type: security
    layers: [schema, api, test]
    assertion: "콜백 성공 → 302, Location은 설정값(요청 파라미터와 무관). SESSION 쿠키가 HttpOnly · Secure · SameSite=Lax · Path=/로 오고, auth_session에 그 값의 SHA-256 해시 행이 있다. 이전 SESSION 쿠키를 들고 로그인하면 새 쿠키 값은 이전과 다르고 이전 세션 행은 revoked_at이 채워진다. 응답은 KAKAO-STATE 쿠키를 Max-Age=0으로 지운다"
    priority: must
    verify: machine
    status: active

  - id: AC-5
    source: [PRD-0001 AC 1.1.5]
    description: "로그인 실패는 세션 없이 실패 주소로 보낸다"
    type: behavior
    layers: [api, test]
    assertion: "콜백에 error 파라미터가 있거나, KAKAO-STATE 쿠키가 없거나, state가 다르거나, 카카오 토큰 교환 · 사용자 조회가 실패하면 302로 설정의 실패 주소에 간다. SESSION 쿠키가 없고 instructor · auth_session 행이 늘지 않는다. KAKAO-STATE 쿠키는 지운다"
    priority: must
    verify: machine
    status: active

  - id: AC-6
    source: [PRD-0001 AC 1.1.3, DEC-0008]
    description: "GET /me로 로그인 상태를 확인한다"
    type: security
    layers: [api, test]
    assertion: "유효한 SESSION 쿠키 → 200 { id, name, email }. 쿠키 없음 · DB에 없는 값 · 만료 · 로그아웃된 세션 → 401 { code: UNAUTHENTICATED }"
    priority: must
    verify: machine
    status: active

  - id: AC-7
    source: [PRD-0001 AC 1.1.6]
    description: "세션은 마지막 요청으로부터 14일 유지되고 요청마다 연장된다"
    type: behavior
    layers: [schema, api, test]
    assertion: "인증된 요청 뒤 expires_at이 요청 시각 + 14일(오차 1분 이내)이다. 그 응답은 SESSION 쿠키를 같은 값 · Max-Age=1209600으로 다시 준다. 인증에 실패한 요청은 SESSION 쿠키를 주지 않는다. expires_at이 지난 세션의 쿠키는 401이다"
    priority: must
    verify: machine
    status: active

  - id: AC-8
    source: [PRD-0001 AC 1.1.7]
    description: "로그아웃하면 세션이 즉시 무효가 된다"
    type: security
    layers: [api, test]
    assertion: "POST /auth/logout(X-CSRF: 1) → 204, SESSION 쿠키 Max-Age=0, 세션 행 revoked_at이 채워진다. 같은 쿠키로 GET /me → 401. 쿠키가 없거나 이미 무효인 세션으로 로그아웃해도 204"
    priority: must
    verify: machine
    status: active

  - id: AC-9
    source: [DEC-0008]
    description: "GET이 아닌 요청은 X-CSRF: 1 헤더가 있어야 한다"
    type: security
    layers: [api, test]
    assertion: "POST /auth/logout에 X-CSRF 헤더가 없으면 403 { code: CSRF_HEADER_MISSING }이고 세션은 그대로다. 인증이 필요한 경로에 세션 없이 헤더도 없이 POST하면 401이다(401이 403보다 먼저)"
    priority: must
    verify: machine
    status: active

  - id: AC-10
    source: [DEC-0002, BE-ADR-0014]
    description: "세션 ID · 카카오 code · 토큰 · secret은 DB와 로그에 남지 않는다"
    type: security
    layers: [schema, test]
    assertion: "auth_session에 세션 원본 컬럼이 없고 저장된 값이 쿠키 값과 다르다(해시). 로그인 · 로그아웃 · 카카오 실패 흐름 테스트 중 출력된 로그에 테스트용 code · 액세스 토큰 · client secret · 세션 ID 문자열이 없다. 우리 코드와 Spring 웹 · 보안 · JDBC logger를 TRACE로 낮춰도 같다"
    priority: must
    verify: machine
    status: active

  - id: AC-11
    source: [PRD-0001 AC 2.1.5, Q2, Q34]
    description: "반복 규칙은 요일마다 하나씩 등록되고, 겹치면 전부 거부한다"
    type: validation
    layers: [schema, api, test]
    assertion: "POST /instructor/recurrences { weekdays: [MON, WED], startTime: 20:00, capacity: 8 } → 201, items 2개, recurrence 2행. weekdays 빈 배열 · 중복, startTime 형식 오류, capacity 0 · 51이면 400 VALIDATION_FAILED이고 행이 늘지 않는다. WED 20:00 켜진 규칙이 있을 때 [MON, WED] 등록 → 409 RECURRENCE_DUPLICATE, weekdays에 WED, MON도 저장되지 않는다. GET 목록은 월 → 일, 같은 요일은 시각 순이고 다른 강사의 규칙이 없다"
    priority: must
    verify: machine
    status: active

  - id: AC-12
    source: [PRD-0001 AC 2.1.2, PRD-0001 AC 2.1.3, Q34]
    description: "규칙을 저장하면 오픈 범위 안의 회차가 생긴다"
    type: behavior
    layers: [schema, domain, test]
    assertion: "Clock을 목요일 12:00(서울)로 고정하고 오픈 범위 14일에 화 20:00 · 정원 8 규칙을 등록하면 class_slot이 다음 화요일 · 그다음 화요일 2행이고 starts_at은 각 날짜 20:00+09:00, capacity 8이다. Clock을 화요일 21:00으로 고정하고 화 20:00 규칙을 등록하면 오늘 회차는 없다. Clock을 목요일 12:00, 오픈 범위 7일로 두고 목 20:00 규칙을 등록하면 오늘 회차 1개만 생기고 오늘 + 7일(다음 목요일)은 없다. 생성을 한 번 더 돌려도 행 수가 같다"
    priority: must
    verify: machine
    status: active
    failure_modes:
      - symptom: "회차 시각이 9시간 어긋남"
        cause: "날짜 + 시각을 서울이 아닌 DB 세션 타임존으로 읽음(AT TIME ZONE 누락)"

  - id: AC-13
    source: [PRD-0001 AC 2.1.4, Q18]
    description: "규칙을 끄면 이후 생성만 멈추고, 다시 켜면 이어서 만든다"
    type: behavior
    layers: [api, test]
    assertion: "규칙을 끄면(active false) 이미 만든 회차는 그대로이고, Clock을 넘겨 다시 생성해도 그 규칙의 새 회차가 없다. 다시 켜면(active true) 응답 전에 오픈 범위 안의 회차가 생긴다. 같은 요일 · 시각의 켜진 규칙이 있으면 다시 켜기는 409 RECURRENCE_DUPLICATE이고 active는 false 그대로다"
    priority: must
    verify: machine
    status: active

  - id: AC-14
    source: [Q18]
    description: "꺼진 규칙의 남은 회차는 같은 요일 · 시각의 새 규칙이 이어받는다"
    type: behavior
    layers: [domain, test]
    assertion: "규칙 A(화 20:00, 정원 8)의 회차 2개 중 하나를 휴강하고 하나를 19:30으로 옮긴 뒤 A를 끄고 B(화 20:00, 정원 10)를 등록하면 두 회차의 recurrence_id가 B이고 휴강 · 19:30 · 정원 8이 그대로이며 같은 날짜에 20:00 회차가 새로 생기지 않는다. 오픈 범위를 늘려 새로 생긴 B 회차는 정원 10이다. B를 끄고 A를 다시 켜면 오늘 이후 회차가 다시 A의 것이 되고 새 회차가 생기지 않는다"
    priority: must
    verify: machine
    status: active
    failure_modes:
      - symptom: "시각을 옮긴 날에 원래 시각 회차가 하나 더 보임"
        cause: "이어받기 없이 새 규칙의 (recurrence_id, occurs_on)로만 중복을 판단함"

  - id: AC-15
    source: [Q18, Q33, PRD-0001 AC 2.3.4]
    description: "같은 강사의 같은 시각에 휴강 아닌 수업은 하나다"
    type: behavior
    layers: [schema, api, test]
    assertion: "반복 회차와 같은 시각으로 일회성 수업을 등록하거나 다른 회차의 시각을 그 시각으로 바꾸면 409 SLOT_TIME_TAKEN이고 행이 그대로다. 휴강한 회차의 시각에는 일회성 수업을 등록할 수 있다. 다음 주 화 20:00에 일회성 수업을 열고 휴강한 뒤 화 20:00 규칙을 등록하면 그 날짜에는 회차가 생기지 않는다(규칙이 아직 만든 적 없는 날짜라 회차 유니크가 아니라 같은 시각 검사가 막는다). 다른 강사는 같은 시각에 수업을 열 수 있다"
    priority: must
    verify: machine
    status: active

  - id: AC-16
    source: [PRD-0001 AC 2.2.1, PRD-0001 AC 2.2.2]
    description: "매일 자정과 앱 시작 때 모든 강사의 오픈 범위 끝까지 채운다"
    type: behavior
    layers: [domain, test]
    assertion: "강사 2명의 규칙이 있을 때 Clock을 하루 넘기고 전체 생성을 돌리면 두 강사 모두 범위 끝에 새로 들어온 날의 회차가 생긴다. 두 번 돌려도 행 수가 같고, 휴강 · 시각을 바꾼 회차가 다시 생기지 않는다. 자정 작업 메서드에 cron 0 0 0 * * *, zone Asia/Seoul이 붙어 있고 앱 시작(ApplicationReadyEvent) 리스너가 같은 생성을 부른다. ApplicationReadyEvent를 발행하면 회차가 생긴다"
    priority: must
    verify: machine
    status: active

  - id: AC-17
    source: [PRD-0001 AC 1.3.1, PRD-0001 AC 1.3.2, PRD-0001 AC 2.4.2, Q25, Q26, Q34]
    description: "강사 슬롯 목록은 지금 이후 자기 슬롯 전부, 상세는 다른 강사면 404"
    type: behavior
    layers: [api, test]
    assertion: "GET /instructor/slots → 200 { openRangeDays, items }. items는 starts_at이 Clock의 지금 이후인 자기 슬롯만 시각 순이고, 지난 · 진행 중 슬롯과 다른 강사의 슬롯은 없다. 휴강한 슬롯은 canceledAt이 채워져 들어 있고, 오픈 범위를 줄여 범위 밖에 남은 슬롯도 들어 있다. GET /instructor/slots/{id}는 반복 회차면 recurrence { id, weekday, startTime }, 일회성이면 recurrence null. 다른 강사의 id와 없는 id는 같은 404 NOT_FOUND"
    priority: must
    verify: machine
    status: active

  - id: AC-18
    source: [PRD-0001 AC 2.3.2, PRD-0001 AC 2.3.3, Q21]
    description: "반복 회차는 그 회차의 시각만 같은 날 안에서 바꾼다"
    type: behavior
    layers: [api, test]
    assertion: "PATCH /instructor/slots/{id} { startTime: 19:30 } → 200, 그 슬롯의 starts_at만 같은 날 19:30이고 occurs_on · 규칙 · 다른 주 회차는 그대로다. 휴강한 슬롯 → 422 SLOT_CANCELED, 시작한 슬롯 → 422 CLASS_STARTED, 반복 회차에 다른 날짜(date) · 새 시각이 지금 이전 → 400(fields), taken > 0 → 422 SLOT_HAS_BOOKINGS, 같은 시각 수업 있음 → 409 SLOT_TIME_TAKEN. 둘 이상 해당하면 이 순서의 앞 것이다"
    priority: must
    verify: machine
    status: active

  - id: AC-19
    source: [PRD-0001 AC 2.3.4, Q21]
    description: "휴강은 슬롯을 남기고 되돌릴 수 없다"
    type: behavior
    layers: [api, test]
    assertion: "POST /instructor/slots/{id}/cancel → 200 SlotDetail, canceled_at이 채워지고 행이 남는다. 같은 요청을 다시 보내면 200이고 canceled_at이 처음 값 그대로다. 시작한 슬롯이면 422 CLASS_STARTED이고 canceled_at이 비어 있다. 휴강을 되돌리는 경로가 없다"
    priority: must
    verify: machine
    status: active

  - id: AC-20
    source: [Q33]
    description: "일회성 수업은 지금 이후 · 오픈 범위 안에 열고, 날짜까지 옮길 수 있다"
    type: behavior
    layers: [schema, api, test]
    assertion: "POST /instructor/slots { date, startTime, capacity } → 201 SlotDetail, recurrence null, class_slot 1행(recurrence_id null, occurs_on = date). 시작 시각이 지금 이전 → 400(startTime), 날짜가 [오늘, 오늘 + N일) 밖 → 400(date), capacity 0 · 51 → 400(capacity). PATCH { date, startTime }으로 다른 날로 옮기면 starts_at · occurs_on이 같이 바뀌고, 새 날짜가 범위 밖이면 400(date), taken > 0이면 AC-18과 같은 코드로 거부한다. date 없이(또는 지금과 같은 date로) startTime만 바꾸면 범위를 보지 않는다(범위를 줄여 범위 밖에 남은 일회성 수업도 시각은 바뀐다)"
    priority: must
    verify: machine
    status: active

  - id: AC-21
    source: [PRD-0001 AC 2.4.1, PRD-0001 AC 2.4.2, Q19]
    description: "오픈 범위를 늘리면 같은 요청에서 늘어난 구간을 채우고, 줄여도 슬롯은 남는다"
    type: integration
    layers: [api, domain, test]
    assertion: "GET /instructor/settings → { openRangeDays: 14 }. PATCH 6 · 29 → 400. 14 → 28로 늘리면 응답 전에 15 ~ 28일째 회차가 생긴다. 회차 생성이 실패하도록 만들면 PATCH가 실패하고 open_range_days는 14 그대로다(같은 트랜잭션). 이벤트는 요청에서 구한 today · now를 싣는다. 28 → 7로 줄이면 8일째 이후 슬롯이 그대로 남는다. instructor 모듈은 OpenRangeExtended 이벤트만 발행하고 schedule을 직접 부르지 않는다(ModularityTests)"
    priority: must
    verify: machine
    status: active

  - id: AC-22
    source: [Q36, BE-ADR-0003]
    description: "만료된 세션 행은 매일 자정에 지운다"
    type: behavior
    layers: [schema, test]
    assertion: "expires_at이 지난 행 · 로그아웃했지만 만료 전인 행 · 유효한 행이 있을 때 정리 작업을 돌리면 첫 번째만 지워진다. 지운 세션의 쿠키로 GET /me → 401. 작업은 cron 0 0 0 * * *, zone Asia/Seoul이다"
    priority: must
    verify: machine
    status: active

# AC 계약. 테스트가 무엇을 증명해야 하는지의 원본.
# id는 한 번 정하면 바꾸지 않는다. 삭제할 AC는 지우지 말고 status: removed
# Phase 1(US 1 가입 · 로그인 · 세션)은 AC-1 ~ AC-10, Phase 2(US 2 시간표 · 오픈 범위 · 자정 작업)는 AC-11 ~ AC-22,
# Phase 3(US 3 회원 · US 4 링크 · US 5 개봉 상태)은 AC-23 ~ AC-28, Phase 4(수강권 · 카드 · 월 정액 주기)는 AC-29 ~ AC-35다.
# 수강권 AC의 "오늘"도 테스트에서 고정한 Clock 값이다.
# 다음 Phase는 번호를 이어 붙인다(prd.md 1절 진행 단위). 시간표 AC(AC-11 ~ AC-21)의 "지금" · "오늘"은 테스트에서 고정한 Clock 값이다.
# 세션 만료(AC-7 · AC-22)는 DB의 now()를 쓰므로 expires_at도 DB 시각 기준으로 만든다.
spec: docs/spec/instructor/0001-instructor-setup/prd.md
version: 1
criteria:
  - id: AC-1
    source: [PRD-0001 AC 1.1.8, DEC-0008, BE-ADR-0014]
    description: "로그인 시작은 state 쿠키를 심고 카카오 인가 주소로 보낸다"
    type: security
    layers: [api, test]
    assertion: "GET /auth/kakao → 302, Location이 kauth.kakao.com/oauth/authorize이고 client_id · redirect_uri · response_type=code · state 쿼리를 가진다. 응답의 KAKAO-STATE 쿠키 값이 Location의 state와 같고 HttpOnly · Secure · SameSite=Lax · Path=/ · Max-Age=600이다. 두 번 호출하면 state가 다르다"
    priority: must
    verify: machine
    status: active
    failure_modes:
      - symptom: "콜백에서 정상 로그인도 state 불일치로 실패"
        cause: "쿠키 Path · SameSite 설정으로 카카오에서 돌아오는 요청에 쿠키가 안 실림"

  - id: AC-2
    source: [PRD-0001 AC 1.2.1, PRD-0001 AC 1.2.2, PRD-0001 AC 1.2.4]
    description: "처음 로그인한 카카오 계정은 강사와 설정 1행이 만들어진다"
    type: behavior
    layers: [schema, api, test]
    assertion: "처음 보는 카카오 회원 번호로 콜백이 성공하면 instructor 1행(provider=KAKAO)과 setting 1행(open_range_days=14)이 생긴다. 카카오 응답에 닉네임 · 이메일이 없으면 name · email은 null이고 가입은 성공한다"
    priority: must
    verify: machine
    status: active

  - id: AC-3
    source: [PRD-0001 AC 1.2.3]
    description: "같은 카카오 계정은 다시 가입되지 않는다"
    type: behavior
    layers: [schema, test]
    assertion: "이미 가입한 카카오 회원 번호로 다시 로그인하면 같은 instructor.id로 로그인되고 instructor · setting 행 수가 그대로다. 같은 번호의 가입 처리를 두 스레드에서 동시에 실행해도 instructor · setting은 1행씩이다"
    priority: must
    verify: machine
    status: active
    failure_modes:
      - symptom: "동시 로그인에서 500 또는 setting 0행"
        cause: "ON CONFLICT 없이 INSERT하거나, 0행 경로에서 기존 강사 조회를 빠뜨림"

  - id: AC-4
    source: [PRD-0001 AC 1.1.8, DEC-0008, BE-ADR-0008]
    description: "로그인 성공은 새 세션을 발급하고 설정의 성공 주소로 보낸다"
    type: security
    layers: [schema, api, test]
    assertion: "콜백 성공 → 302, Location은 설정값(요청 파라미터와 무관). SESSION 쿠키가 HttpOnly · Secure · SameSite=Lax · Path=/로 오고, auth_session에 그 값의 SHA-256 해시 행이 있다. 이전 SESSION 쿠키를 들고 로그인하면 새 쿠키 값은 이전과 다르고 이전 세션 행은 revoked_at이 채워진다. 응답은 KAKAO-STATE 쿠키를 Max-Age=0으로 지운다"
    priority: must
    verify: machine
    status: active

  - id: AC-5
    source: [PRD-0001 AC 1.1.5]
    description: "로그인 실패는 세션 없이 실패 주소로 보낸다"
    type: behavior
    layers: [api, test]
    assertion: "콜백에 error 파라미터가 있거나, KAKAO-STATE 쿠키가 없거나, state가 다르거나, 카카오 토큰 교환 · 사용자 조회가 실패하면 302로 설정의 실패 주소에 간다. SESSION 쿠키가 없고 instructor · auth_session 행이 늘지 않는다. KAKAO-STATE 쿠키는 지운다"
    priority: must
    verify: machine
    status: active

  - id: AC-6
    source: [PRD-0001 AC 1.1.3, DEC-0008]
    description: "GET /me로 로그인 상태를 확인한다"
    type: security
    layers: [api, test]
    assertion: "유효한 SESSION 쿠키 → 200 { id, name, email }. 쿠키 없음 · DB에 없는 값 · 만료 · 로그아웃된 세션 → 401 { code: UNAUTHENTICATED }"
    priority: must
    verify: machine
    status: active

  - id: AC-7
    source: [PRD-0001 AC 1.1.6]
    description: "세션은 마지막 요청으로부터 14일 유지되고 요청마다 연장된다"
    type: behavior
    layers: [schema, api, test]
    assertion: "인증된 요청 뒤 expires_at이 요청 시각 + 14일(오차 1분 이내)이다. 그 응답은 SESSION 쿠키를 같은 값 · Max-Age=1209600으로 다시 준다. 인증에 실패한 요청은 SESSION 쿠키를 주지 않는다. expires_at이 지난 세션의 쿠키는 401이다"
    priority: must
    verify: machine
    status: active

  - id: AC-8
    source: [PRD-0001 AC 1.1.7]
    description: "로그아웃하면 세션이 즉시 무효가 된다"
    type: security
    layers: [api, test]
    assertion: "POST /auth/logout(X-CSRF: 1) → 204, SESSION 쿠키 Max-Age=0, 세션 행 revoked_at이 채워진다. 같은 쿠키로 GET /me → 401. 쿠키가 없거나 이미 무효인 세션으로 로그아웃해도 204"
    priority: must
    verify: machine
    status: active

  - id: AC-9
    source: [DEC-0008]
    description: "GET이 아닌 요청은 X-CSRF: 1 헤더가 있어야 한다"
    type: security
    layers: [api, test]
    assertion: "POST /auth/logout에 X-CSRF 헤더가 없으면 403 { code: CSRF_HEADER_MISSING }이고 세션은 그대로다. 인증이 필요한 경로에 세션 없이 헤더도 없이 POST하면 401이다(401이 403보다 먼저)"
    priority: must
    verify: machine
    status: active

  - id: AC-10
    source: [DEC-0002, BE-ADR-0014]
    description: "세션 ID · 카카오 code · 토큰 · secret은 DB와 로그에 남지 않는다"
    type: security
    layers: [schema, test]
    assertion: "auth_session에 세션 원본 컬럼이 없고 저장된 값이 쿠키 값과 다르다(해시). 로그인 · 로그아웃 · 카카오 실패 흐름 테스트 중 출력된 로그에 테스트용 code · 액세스 토큰 · client secret · 세션 ID 문자열이 없다. 우리 코드와 Spring 웹 · 보안 · JDBC logger를 TRACE로 낮춰도 같다"
    priority: must
    verify: machine
    status: active

  - id: AC-11
    source: [PRD-0001 AC 2.1.5, PRD-0001 AC 2.1.8, Q2, Q34]
    description: "반복 규칙은 요일마다 하나씩 등록되고, 겹치면 전부 거부한다"
    type: validation
    layers: [schema, api, test]
    assertion: "POST /instructor/recurrences { weekdays: [MON, WED], startTime: 20:00, capacity: 8 } → 201, items 2개, recurrence 2행. weekdays 빈 배열 · 중복, startTime 형식 오류, capacity 0 · 51이면 400 VALIDATION_FAILED이고 행이 늘지 않는다. WED 20:00 켜진 규칙이 있을 때 [MON, WED] 등록 → 409 RECURRENCE_DUPLICATE, weekdays에 WED, MON도 저장되지 않는다. GET 목록은 월 → 일, 같은 요일은 시각 순이고 다른 강사의 규칙이 없다"
    priority: must
    verify: machine
    status: active

  - id: AC-12
    source: [PRD-0001 AC 2.1.2, PRD-0001 AC 2.1.3, Q34]
    description: "규칙을 저장하면 오픈 범위 안의 회차가 생긴다"
    type: behavior
    layers: [schema, domain, test]
    assertion: "Clock을 목요일 12:00(서울)로 고정하고 오픈 범위 14일에 화 20:00 · 정원 8 규칙을 등록하면 class_slot이 다음 화요일 · 그다음 화요일 2행이고 starts_at은 각 날짜 20:00+09:00, capacity 8이다. Clock을 화요일 21:00으로 고정하고 화 20:00 규칙을 등록하면 오늘 회차는 없다. Clock을 목요일 12:00, 오픈 범위 7일로 두고 목 20:00 규칙을 등록하면 오늘 회차 1개만 생기고 오늘 + 7일(다음 목요일)은 없다. 생성을 한 번 더 돌려도 행 수가 같다"
    priority: must
    verify: machine
    status: active
    failure_modes:
      - symptom: "회차 시각이 9시간 어긋남"
        cause: "날짜 + 시각을 서울이 아닌 DB 세션 타임존으로 읽음(AT TIME ZONE 누락)"

  - id: AC-13
    source: [PRD-0001 AC 2.1.4, PRD-0001 AC 2.1.6, Q18]
    description: "규칙을 끄면 이후 생성만 멈추고, 다시 켜면 이어서 만든다"
    type: behavior
    layers: [api, test]
    assertion: "규칙을 끄면(active false) 이미 만든 회차는 그대로이고, Clock을 넘겨 다시 생성해도 그 규칙의 새 회차가 없다. 다시 켜면(active true) 응답 전에 오픈 범위 안의 회차가 생긴다. 같은 요일 · 시각의 켜진 규칙이 있으면 다시 켜기는 409 RECURRENCE_DUPLICATE이고 active는 false 그대로다"
    priority: must
    verify: machine
    status: active

  - id: AC-14
    source: [PRD-0001 AC 2.1.7, Q18]
    description: "꺼진 규칙의 남은 회차는 같은 요일 · 시각의 새 규칙이 이어받는다"
    type: behavior
    layers: [domain, test]
    assertion: "규칙 A(화 20:00, 정원 8)의 회차 2개 중 하나를 휴강하고 하나를 19:30으로 옮긴 뒤 A를 끄고 B(화 20:00, 정원 10)를 등록하면 두 회차의 recurrence_id가 B이고 휴강 · 19:30 · 정원 8이 그대로이며 같은 날짜에 20:00 회차가 새로 생기지 않는다. 오픈 범위를 늘려 새로 생긴 B 회차는 정원 10이다. B를 끄고 A를 다시 켜면 오늘 이후 회차가 다시 A의 것이 되고 새 회차가 생기지 않는다"
    priority: must
    verify: machine
    status: active
    failure_modes:
      - symptom: "시각을 옮긴 날에 원래 시각 회차가 하나 더 보임"
        cause: "이어받기 없이 새 규칙의 (recurrence_id, occurs_on)로만 중복을 판단함"

  - id: AC-15
    source: [PRD-0001 AC 2.6.1, PRD-0001 AC 2.6.2, Q18, Q33, PRD-0001 AC 2.3.4]
    description: "같은 강사의 같은 시각에 휴강 아닌 수업은 하나다"
    type: behavior
    layers: [schema, api, test]
    assertion: "반복 회차와 같은 시각으로 일회성 수업을 등록하거나 다른 회차의 시각을 그 시각으로 바꾸면 409 SLOT_TIME_TAKEN이고 행이 그대로다. 휴강한 회차의 시각에는 일회성 수업을 등록할 수 있다. 다음 주 화 20:00에 일회성 수업을 열고 휴강한 뒤 화 20:00 규칙을 등록하면 그 날짜에는 회차가 생기지 않는다(규칙이 아직 만든 적 없는 날짜라 회차 유니크가 아니라 같은 시각 검사가 막는다). 다른 강사는 같은 시각에 수업을 열 수 있다"
    priority: must
    verify: machine
    status: active

  - id: AC-16
    source: [PRD-0001 AC 2.2.1, PRD-0001 AC 2.2.2]
    description: "매일 자정과 앱 시작 때 모든 강사의 오픈 범위 끝까지 채운다"
    type: behavior
    layers: [domain, test]
    assertion: "강사 2명의 규칙이 있을 때 Clock을 하루 넘기고 전체 생성을 돌리면 두 강사 모두 범위 끝에 새로 들어온 날의 회차가 생긴다. 두 번 돌려도 행 수가 같고, 휴강 · 시각을 바꾼 회차가 다시 생기지 않는다. 자정 작업 메서드에 cron 0 0 0 * * *, zone Asia/Seoul이 붙어 있고 앱 시작(ApplicationReadyEvent) 리스너가 같은 생성을 부른다. ApplicationReadyEvent를 발행하면 회차가 생긴다"
    priority: must
    verify: machine
    status: active

  - id: AC-17
    source: [PRD-0001 AC 1.3.1, PRD-0001 AC 1.3.2, PRD-0001 AC 2.4.2, Q25, Q26, Q34]
    description: "강사 슬롯 목록은 지금 이후 자기 슬롯 전부, 상세는 다른 강사면 404"
    type: behavior
    layers: [api, test]
    assertion: "GET /instructor/slots → 200 { openRangeDays, items }. items는 starts_at이 Clock의 지금 이후인 자기 슬롯만 시각 순이고, 지난 · 진행 중 슬롯과 다른 강사의 슬롯은 없다. 휴강한 슬롯은 canceledAt이 채워져 들어 있고, 오픈 범위를 줄여 범위 밖에 남은 슬롯도 들어 있다. GET /instructor/slots/{id}는 반복 회차면 recurrence { id, weekday, startTime }, 일회성이면 recurrence null. 다른 강사의 id와 없는 id는 같은 404 NOT_FOUND"
    priority: must
    verify: machine
    status: active

  - id: AC-18
    source: [PRD-0001 AC 2.3.3, PRD-0001 AC 2.3.5, PRD-0001 AC 2.3.6, Q21]
    description: "반복 회차는 그 회차의 시각만 같은 날 안에서 바꾼다"
    type: behavior
    layers: [api, test]
    assertion: "PATCH /instructor/slots/{id} { startTime: 19:30 } → 200, 그 슬롯의 starts_at만 같은 날 19:30이고 occurs_on · 규칙 · 다른 주 회차는 그대로다. 휴강한 슬롯 → 422 SLOT_CANCELED, 시작한 슬롯 → 422 CLASS_STARTED, 반복 회차에 다른 날짜(date) · 새 시각이 지금 이전 → 400(fields), taken > 0 → 422 SLOT_HAS_BOOKINGS, 같은 시각 수업 있음 → 409 SLOT_TIME_TAKEN. 둘 이상 해당하면 이 순서의 앞 것이다"
    priority: must
    verify: machine
    status: active

  - id: AC-19
    source: [PRD-0001 AC 2.3.4, PRD-0001 AC 2.3.6, Q21]
    description: "휴강은 슬롯을 남기고 되돌릴 수 없다"
    type: behavior
    layers: [api, test]
    assertion: "POST /instructor/slots/{id}/cancel → 200 SlotDetail, canceled_at이 채워지고 행이 남는다. 같은 요청을 다시 보내면 200이고 canceled_at이 처음 값 그대로다. 시작한 슬롯이면 422 CLASS_STARTED이고 canceled_at이 비어 있다. 휴강을 되돌리는 경로가 없다"
    priority: must
    verify: machine
    status: active

  - id: AC-20
    source: [PRD-0001 AC 2.5.1, PRD-0001 AC 2.5.2, PRD-0001 AC 2.5.3, PRD-0001 AC 2.5.4, Q33]
    description: "일회성 수업은 지금 이후 · 오픈 범위 안에 열고, 날짜까지 옮길 수 있다"
    type: behavior
    layers: [schema, api, test]
    assertion: "POST /instructor/slots { date, startTime, capacity } → 201 SlotDetail, recurrence null, class_slot 1행(recurrence_id null, occurs_on = date). 시작 시각이 지금 이전 → 400(startTime), 날짜가 [오늘, 오늘 + N일) 밖 → 400(date), capacity 0 · 51 → 400(capacity). PATCH { date, startTime }으로 다른 날로 옮기면 starts_at · occurs_on이 같이 바뀌고, 새 날짜가 범위 밖이면 400(date), taken > 0이면 AC-18과 같은 코드로 거부한다. date 없이(또는 지금과 같은 date로) startTime만 바꾸면 범위를 보지 않는다(범위를 줄여 범위 밖에 남은 일회성 수업도 시각은 바뀐다)"
    priority: must
    verify: machine
    status: active

  - id: AC-21
    source: [PRD-0001 AC 2.4.1, PRD-0001 AC 2.4.2, Q19]
    description: "오픈 범위를 늘리면 같은 요청에서 늘어난 구간을 채우고, 줄여도 슬롯은 남는다"
    type: integration
    layers: [api, domain, test]
    assertion: "GET /instructor/settings → { openRangeDays: 14 }. PATCH 6 · 29 → 400. 14 → 28로 늘리면 응답 전에 15 ~ 28일째 회차가 생긴다. 회차 생성이 실패하도록 만들면 PATCH가 실패하고 open_range_days는 14 그대로다(같은 트랜잭션). 이벤트는 요청에서 구한 today · now를 싣는다. 28 → 7로 줄이면 8일째 이후 슬롯이 그대로 남는다. instructor 모듈은 InstructorOpenRangeExtendedEvent 이벤트만 발행하고 schedule을 직접 부르지 않는다(ModularityTests)"
    priority: must
    verify: machine
    status: active

  - id: AC-22
    source: [Q36, BE-ADR-0003]
    description: "만료된 세션 행은 매일 자정에 지운다"
    type: behavior
    layers: [schema, test]
    assertion: "expires_at이 지난 행 · 로그아웃했지만 만료 전인 행 · 유효한 행이 있을 때 정리 작업을 돌리면 첫 번째만 지워진다. 지운 세션의 쿠키로 GET /me → 401. 작업은 cron 0 0 0 * * *, zone Asia/Seoul이다"
    priority: must
    verify: machine
    status: active

  - id: AC-23
    source: [PRD-0001 AC 3.1.1, PRD-0001 AC 3.1.2, PRD-0001 AC 3.1.3, Q31]
    description: "회원은 이름만으로 추가되고 그 자리에서 링크가 발급된다"
    type: behavior
    layers: [schema, api, test]
    assertion: "POST /instructor/members { name: '  김OO  ', memo: '목요반' } → 201 { member: { id, name: '김OO', memo: '목요반', status: ACTIVE, linkOpened: false }, linkUrl }. member 1행 · revoked_at이 빈 member_link 1행. memo ''는 null로 저장. name 빈 · 공백만 · 51자, memo 501자 → 400 VALIDATION_FAILED(fields), member · member_link 행 없음. 같은 이름으로 다시 추가하면 201이고 회원이 2명이다. 로그인하지 않으면 401, X-CSRF 헤더가 없으면 403. 링크 INSERT가 실패하면 회원 행도 남지 않는다(같은 트랜잭션)"
    priority: must
    verify: machine
    status: active

  - id: AC-24
    source: [PRD-0001 AC 4.1.1, PRD-0001 AC 4.1.2, PRD-0001 AC 4.1.3, PRD-0001 AC 4.4.1, Q32]
    description: "링크 토큰은 22자 난수이고 서버에는 해시만 남는다"
    type: security
    layers: [schema, api, test]
    assertion: "linkUrl은 설정한 회원 화면 주소 + /m/ + token이고 token은 [A-Za-z0-9_-]{22}다(16바이트, 패딩 없음). member_link.token_hash = SHA-256(token)이고 32바이트다. member_link에 토큰 원본 컬럼이 없다. 회원 추가 · 재발급 응답의 Cache-Control은 정확히 no-store다(Security 기본값 no-cache, no-store, max-age=0, must-revalidate가 아니다). 로그를 TRACE로 낮추고 추가 · 재발급을 한 뒤 출력 전체에 token이 없다. 두 번 발급한 token이 다르다"
    priority: must
    verify: machine
    status: active
    failure_modes:
      - symptom: "로그 수준을 DEBUG로 낮추면 응답 본문의 linkUrl이 로그에 찍힌다"
        cause: "Spring MVC가 응답을 쓸 때 본문 객체의 toString을 DEBUG에서는 100자까지, TRACE에서는 전체를 남긴다. 재발급 응답은 짧아 DEBUG에서도 토큰이 찍힌다"

  - id: AC-25
    source: [PRD-0001 AC 1.3.1, PRD-0001 AC 5.1.1, PRD-0001 AC 5.1.3, PRD-0001 AC 5.1.5, PRD-0001 AC 5.1.7, Q22]
    description: "회원 목록은 미개봉 ACTIVE → 나머지 ACTIVE → ENDED 순이고 미개봉 수에서 ENDED를 뺀다"
    type: behavior
    layers: [api, test]
    assertion: "회원 5명(미개봉 ACTIVE 나 · 가, 개봉 ACTIVE 다, 미개봉 ENDED 라, 개봉 ENDED 마)과 다른 강사의 회원 1명이 있을 때 GET /instructor/members → 200 { unopenedCount: 2, items: [가, 나, 다, 라, 마] }. 다른 강사의 회원은 없다. 같은 이름 두 명은 id 순. 링크를 연 뒤(first_opened_at) 재발급하면 linkOpened false이고 unopenedCount에 다시 들어간다. 이전 링크의 first_opened_at은 linkOpened에 쓰이지 않는다"
    priority: must
    verify: machine
    status: active

  - id: AC-26
    source: [PRD-0001 AC 1.3.2]
    description: "회원 상세는 다른 강사의 회원이면 없는 회원과 같은 404"
    type: security
    layers: [api, test]
    assertion: "GET /instructor/members/{id} → 200 { id, name, memo, status, linkOpened }. 다른 강사의 회원 id와 없는 id는 같은 404 NOT_FOUND. id가 숫자가 아니면 400"
    priority: must
    verify: machine
    status: active

  - id: AC-27
    source: [PRD-0001 AC 3.1.4, PRD-0001 AC 3.3.1, PRD-0001 AC 3.3.3, Q29]
    description: "회원 수정은 보낸 필드만 바꾸고, 수강 종료는 삭제가 아니다"
    type: behavior
    layers: [api, test]
    assertion: "PATCH /instructor/members/{id} { memo: '화요반' } → 200, memo만 바뀌고 name · status는 그대로. { name: null } → 400. { name: '' } · 51자 → 400. { memo: null } · { memo: '' } → memo null. { status: 'ENDED' } → status ENDED, member · member_link 행 그대로. 다시 { status: 'ACTIVE' } → ACTIVE. { status: 'DELETED' } · { status: null } → 400. {} → 200, 바뀌는 것 없음. ENDED 회원에 { status: 'ENDED' } → 200. 다른 강사의 id → 404이고 그 회원은 그대로. DELETE /instructor/members/{id} 경로가 없다"
    priority: must
    verify: machine
    status: active

  - id: AC-28
    source: [PRD-0001 AC 4.3.1, PRD-0001 AC 4.3.2, PRD-0001 AC 3.3.4, PRD-0001 AC 5.1.3]
    description: "링크를 재발급하면 이전 링크는 끊기고 개봉 상태는 처음으로 돌아간다"
    type: behavior
    layers: [schema, api, test]
    assertion: "POST /instructor/members/{id}/link → 201 { linkUrl }. 이전 링크 행은 revoked_at이 채워져 남고, 새 행의 token_hash는 새 token의 해시이며 first_opened_at이 비어 있다. member.id는 그대로. ENDED 회원도 201. 다른 강사의 id → 404이고 링크가 그대로. 한 회원에 revoked_at이 빈 행을 두 개 넣으면 member_link_active_uidx 위반이다. 같은 회원에게 재발급 두 요청을 동시에 보내면 둘 다 201이고 revoked_at이 빈 행은 하나다"
    priority: must
    verify: machine
    status: active

  - id: AC-29
    source: [PRD-0001 AC 3.2.1, PRD-0001 AC 3.2.5, PRD-0001 AC 3.2.11, PRD-0001 AC 3.2.18, Q27, Q31]
    description: "횟수권은 기간과 횟수로 등록한다"
    type: behavior
    layers: [schema, api, test]
    assertion: "오늘 11-12에 POST /instructor/members/{id}/entitlements { kind: PASS, startsOn: 11-01, endsOn: 12-31, maxCount: 10 } → 201 { kind: PASS, id, startsOn, endsOn, maxCount: 10, remaining: 10, state: ACTIVE }, entitlement 1행(kind PASS, source_id null). startsOn > endsOn · maxCount 0 · 1000 · endsOn 11-11 · kind 없음 · kind DAILY → 400(fields), 행 없음. endsOn 11-12(오늘)는 201. 같은 기간 횟수권을 다시 등록해도 201이고 2행. DELETE /instructor/entitlements/{id} 같은 삭제 · 기간 수정 경로가 없다"
    priority: must
    verify: machine
    status: active

  - id: AC-30
    source: [PRD-0001 AC 3.2.8, PRD-0001 AC 3.2.9, PRD-0001 AC 3.2.12, PRD-0001 AC 3.2.13, PRD-0001 AC 3.2.14, Q23, Q31]
    description: "월 정액은 4주 단위로 등록하고 오픈 범위 안의 주기를 바로 만든다"
    type: behavior
    layers: [schema, api, test]
    assertion: "오늘 11-12 · 오픈 범위 14일에 { kind: SUBSCRIPTION, limit: { per: WEEK, count: 2 }, startsOn: 11-05, weeks: 8 } → 201, subscription 1행(period_unit WEEK, count_per_period 2, period_count 8, ends_on 12-30). 응답 전에 entitlement 주기 행이 11-12 · 11-19 시작 2개(각 7일 · max_count 2 · source_id = 그 등록). 11-05 시작 주기는 11-11에 끝나 없고, 11-26 시작은 범위 [11-12, 11-26) 밖이라 없다. per FOUR_WEEKS · weeks 8 → period_count 2, 주기 28일. weeks 3 · 0 · 52, count 0 · 100, per MONTH, startsOn 10-01 · weeks 4(종료일 10-28이 오늘 이전) → 400, 행 없음"
    priority: must
    verify: machine
    status: active

  - id: AC-31
    source: [PRD-0001 AC 3.2.10, PRD-0001 AC 3.2.15, PRD-0001 AC 3.2.17, PRD-0001 AC 3.3.4, Q24, Q28, Q34]
    description: "수강 종료 회원, 다른 종류와 겹치는 기간, 만료되지 않은 다른 종류는 등록하지 않는다"
    type: behavior
    layers: [api, domain, test]
    assertion: "다른 강사 · 없는 회원 → 404. ENDED 회원 → 422 MEMBER_ENDED, 행 없음. 횟수권 11-01 ~ 11-30이 있을 때 월 정액(startsOn 12-03, weeks 4) → 422 ENTITLEMENT_OTHER_KIND_ACTIVE, availableFrom 12-01. 만료된 횟수권(10-01 ~ 11-11)만 있고 월 정액 기간이 그와 겹치지 않으면 201. 월 정액 11-05 ~ 12-30이 있을 때 횟수권 12-20 ~ 12-31(아직 만들지 않은 주기와 겹침) → 422 ENTITLEMENT_OTHER_KIND_ACTIVE, availableFrom 12-31. 다른 종류가 이미 만료됐고 기간만 겹치면 ENTITLEMENT_PERIOD_OVERLAP(만료되지 않은 다른 종류가 있으면 겹침과 상관없이 OTHER_KIND_ACTIVE가 먼저). 같은 회원에게 횟수권 · 월 정액을 동시에 보내면 하나만 201이고 다른 하나는 422(회원 행 잠금). 앞선 검사를 지나 entitlement_kind_no_overlap에 걸리면 422 ENTITLEMENT_PERIOD_OVERLAP"
    priority: must
    verify: machine
    status: active

  - id: AC-32
    source: [PRD-0001 AC 3.2.8, PRD-0001 AC 3.2.9, PRD-0001 AC 3.3.4, Q19]
    description: "월 정액 주기는 매일 자정 · 앱 시작 · 오픈 범위를 늘릴 때 채운다"
    type: integration
    layers: [domain, test]
    assertion: "강사 2명의 월 정액이 있을 때 Clock을 하루 넘겨 전체 주기 생성을 돌리면 새로 범위에 들어온 주기가 두 강사 모두 생긴다. 한 월 정액의 INSERT가 실패하도록 만들어도 다른 월 정액의 주기는 생기고 실패 로그가 남는다. ApplicationReadyEvent를 발행하면 주기가 생긴다. 작업은 cron 0 0 0 * * *, zone Asia/Seoul. 오픈 범위를 14 → 28로 늘리면 응답 전에 늘어난 범위의 주기가 생기고, 한 월 정액의 생성이 실패해도 open_range_days는 28이고 회차와 다른 월 정액 주기는 생긴다. 두 번 돌려도 행 수가 같고 period_count를 넘는 주기는 없다. ENDED 회원의 월 정액도 주기가 생긴다"
    priority: must
    verify: machine
    status: active

  - id: AC-33
    source: [PRD-0001 AC 3.2.4, PRD-0001 AC 3.2.15, PRD-0001 AC 3.2.19, PRD-0001 AC 3.2.20, PRD-0002 AC 2.1.5, PRD-0002 AC 2.1.6, PRD-0002 AC 2.1.7, PRD-0002 AC 2.1.8, PRD-0002 AC 2.1.9, PRD-0003 AC 1.3.5, Q34]
    description: "수강권 카드는 상태 · 남은 횟수 · 지금 주기를 계산해 다음에 차감될 순서로 준다"
    type: behavior
    layers: [domain, test]
    assertion: "오늘 11-12. 횟수권 11-01 ~ 11-30(used 3/10) → ACTIVE remaining 7. 11-20 시작 → NOT_STARTED. 10-01 ~ 11-11 → EXPIRED. 11-12 종료 · used 10/10 → ACTIVE remaining 0. 월 정액 11-05 ~ 12-30 → ACTIVE, currentPeriod는 11-12 ~ 11-18 주기 { entitlementId, maxCount 2, remaining }. 오늘을 덮는 주기 행이 없으면 currentPeriod null. 섞여 있으면 순서: ACTIVE 잔여≥1(끝 날짜 이른 순, 월 정액은 currentPeriod.endsOn) → ACTIVE 잔여 0(currentPeriod 없는 월 정액 포함) → NOT_STARTED(시작일 이른 순) → EXPIRED(종료일 늦은 순). 기준 날짜가 같으면 횟수권 먼저, 같은 종류는 id 순"
    priority: must
    verify: machine
    status: active

  - id: AC-34
    source: [PRD-0001 AC 3.2.4, PRD-0001 AC 3.2.20, PRD-0001 AC 5.1.6, PRD-0002 AC 2.1.8, PRD-0002 AC 2.1.9, BE-ADR-0020]
    description: "회원 목록은 맨 앞 카드, 회원 상세는 카드 전부를 준다"
    type: integration
    layers: [api, test]
    assertion: "GET /instructor/members의 각 줄 frontCard = AC-33 순서 맨 앞 카드. 수강권 없음 · 만료만 있음 → frontCard null. GET /instructor/members/{id}의 cards = 카드 전부, EXPIRED는 맨 뒤. 다른 강사의 수강권은 어디에도 없다. 회원 3명의 목록에서 카드 조회 SQL이 한 번 실행된다(카드 SQL의 식별 주석이 JDBC DEBUG 로그에 한 번 나온다). AC-25 · AC-26 테스트가 bff로 옮긴 뒤에도 통과하고, bff 밖의 코드는 bff에 의존하지 않는다(ArchitectureTests)"
    priority: must
    verify: machine
    status: active

  - id: AC-35
    source: [PRD-0001 AC 3.2.19, PRD-0001 AC 3.2.21, PRD-0003 AC 5.2.3, PRD-0003 AC 5.2.4, Q27]
    description: "잔여 수정은 바꿀 양을 보내고, 끝난 횟수권 · 지금이 아닌 주기는 고치지 않는다"
    type: behavior
    layers: [api, test]
    assertion: "횟수권(used 3/10) POST /instructor/entitlements/{id}/adjust { delta: 1 } → 200 card remaining 8(used 2). delta 0 · 없음 · 1.5 → 400. 종료일 지난 횟수권 → 422 ENTITLEMENT_EXPIRED. 시작 전 횟수권 → 200. 월 정액의 지난 주기 · 다음 주기 entitlementId → 422 PERIOD_NOT_CURRENT, 지금 주기 → 200이고 응답은 월 정액 카드. used 0에서 delta 1 · used max에서 delta -1 → 422 REMAINING_OUT_OF_RANGE. 다른 강사 · 없는 id → 404. 판정 순서는 400 → 404 → ENTITLEMENT_EXPIRED → PERIOD_NOT_CURRENT → REMAINING_OUT_OF_RANGE이고 둘 이상 해당하면 앞 것. UPDATE는 used_count - delta를 조건부로 해서 그 사이 바뀐 used_count를 덮어쓰지 않는다"
    priority: must
    verify: machine
    status: active

